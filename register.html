        /* Sürüşmə və ölçü problemlərini həll edən əlavə CSS */
        html, body {
            height: 100%; /* HTML və body-nin tam hündürlüyü almasını təmin edir */
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* Üfüqi sürüşməni ləğv edir */

        /* 1. Sürüşmə (Scroll) Problemini tam həll edirik */
html, body {
    height: auto !important; /* 100% yerinə auto veririk ki, içindəki qədər uzansın */
    min-height: 100vh;
    margin: 0;
    padding: 0;
    overflow-y: auto !important; /* Mütləq şaquli sürüşməyə icazə veririk */
    overflow-x: hidden;
}

.auth-body {
    background: linear-gradient(135deg, #0a0b10 0%, #16181f 50%, #0f1015 100%);
    min-height: 100vh;
    display: flex;
    align-items: center; /* Mərkəzləşdirir */
    justify-content: center;
    padding: 40px 20px; /* Üst və aşağıdan boşluq veririk ki, kənarlara yapışmasın */
    position: relative;
    box-sizing: border-box;
}

/* 2. Formun Ölçülərini Kiçildirik */
.auth-container {
    background: rgba(22, 24, 31, 0.85);
    backdrop-filter: blur(25px);
    border-radius: 20px; /* Daha yumşaq künclər */
    border: 1px solid rgba(255, 255, 255, 0.1);
    width: 100%;
    max-width: 420px; /* 500px-dən 420px-ə endirildi */
    padding: 30px;    /* 50px-dən 30px-ə endirildi */
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    position: relative;
    z-index: 1;
}

/* Loqo və Başlıq hissəsini yığcamlaşdırırıq */
.auth-header {
    text-align: center;
    margin-bottom: 25px; /* Boşluğu azaltdıq */
}

.auth-header .logo {
    font-size: 32px; /* 42px-dən 32px-ə endirildi */
    font-weight: 900;
    margin-bottom: 10px;
}

.auth-header h1 {
    font-size: 22px; /* 28px-dən 22px-ə endirildi */
    margin-bottom: 5px;
}

.auth-header p {
    font-size: 14px;
    line-height: 1.4;
}

/* Inputlar arası məsafəni optimallaşdırırıq */
.auth-form {
    display: flex;
    flex-direction: column;
    gap: 15px; /* Boşluğu 20-dən 15-ə saldıq */
}

.form-group label {
    font-size: 13px;
    margin-bottom: 5px;
}

.input-with-icon input {
    padding: 12px 15px 12px 45px; /* Daha nazik inputlar */
    font-size: 14px;
}

.auth-btn {
    padding: 14px;
    font-size: 15px;
    margin-top: 5px;
}

.auth-footer {
    margin-top: 20px;
    font-size: 13px;
}

/* Mobil cihazlar üçün tam uyğunlaşdırma */
@media (max-width: 480px) {
    .auth-container {
        padding: 20px;
    }
    .auth-header .logo {
        font-size: 28px;
    }
}

        .input-with-icon {

        .input-with-icon input {
            width: 100%;

            border-color: #ff4d00;

        .password-field {
            position: relative;

        .toggle-password {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 5px;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: #ff4d00;
        }

        .terms-checkbox {
            display: flex;
            align-items: flex-start;

            margin: 10px 0;
            cursor: pointer;
        }

        .terms-checkbox input {

        .terms-checkbox label {
            color: #a0a0a0;

            line-height: 1.5;
            cursor: pointer;
        }

        .terms-checkbox a {
            color: #00d4ff;
            text-decoration: none;
            transition: color 0.3s;
        }

        .terms-checkbox a:hover {
            color: #ff4d00;
            text-decoration: underline;
        }

        .auth-btn {

            padding: 18px;

            margin-top: 10px;
        }

            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 77, 0, 0.3);
        }

        .auth-footer {
            text-align: center;

            font-size: 14px;
            margin-top: 30px;
        }

        .auth-footer a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
            transition: color 0.3s;
        }

        .auth-footer a:hover {
            color: #ff4d00;
            text-decoration: underline;
        }

        .back-home {

<body class="auth-body">
    <!-- Floating background icons -->
    <div class="floating-icon" style="top: 10%; left: 10%;"><i class="fas fa-user-plus"></i></div>

    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i>
        <span>Əsas Səhifə</span>
    </a>

    <div class="auth-container">
        <div class="auth-header">
            <a href="index.html" class="logo">CineWave</a>
            <h1>Premium Qeydiyyat</h1>
            <p>Premium üzv olun və limitsiz film təcrübəsinə başlayın</p>
        </div>

        <form id="register-form" class="auth-form">
            <div class="form-group">
                <label for="fullName">
                    <i class="fas fa-user"></i> Tam Ad
                </label>
                <div class="input-with-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" id="fullName" name="fullName" placeholder="Ad və Soyad" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i> Email Ünvanı
                </label>
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="username">
                    <i class="fas fa-at"></i> İstifadəçi Adı
                </label>
                <div class="input-with-icon">
                    <i class="fas fa-at"></i>
                    <input type="text" id="username" name="username" placeholder="istifadəçi123" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Şifrə
                </label>
                <div class="password-field">
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Ən azı 8 simvol" required 
                               oninput="checkPasswordStrength(this.value)">
                    </div>
                   <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
    <i class="fas fa-eye"></i>
</button>
                </div>
                <div class="password-strength">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <div class="strength-text" id="strengthText">Zəif</div>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    <i class="fas fa-lock"></i> Şifrəni Təsdiq Edin
                </label>
                <div class="password-field">
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Şifrəni təkrar daxil edin" required>
                    </div>
                   <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">

<div class="cf-turnstile" data-sitekey="0x4AAAAAACf7V8dmY7jh--F_" style="margin-bottom: 15px;"></div>

<script>
    // Şifrəni göstər/gizlə funksiyası (Bütün səhifələr üçün)
    function togglePassword(fieldId, btn) {
        const passwordField = document.getElementById(fieldId);
        const icon = btn.querySelector('i');
        
        if (passwordField.type === 'password') {
            passwordField.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            passwordField.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    // Şifrə gücü yoxlaması (Qeydiyyat səhifəsi üçün)
    function checkPasswordStrength(password) {
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');
        if (!strengthFill || !strengthText) return;

        let strength = 0;
        if (password.length > 5) strength++;
        if (password.length > 9) strength++;
        if (/[A-Z]/.test(password)) strength++;
        if (/[0-9]/.test(password)) strength++;
        if (/[^A-Za-z0-9]/.test(password)) strength++;

        let width = (strength / 5) * 100;
        let text = 'Zəif';
        let color = '#ff4d00';

        if (strength === 2) { text = 'Orta'; color = '#ffc107'; }
        else if (strength >= 3) { text = 'Yaxşı'; color = '#28a745'; }
        else if (strength >= 5) { text = 'Mükəmməl'; color = '#00d4ff'; }

        strengthFill.style.width = width + '%';
        strengthFill.style.background = color;
        strengthText.innerText = text;
        strengthText.style.color = color;
    }
</script>
