<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineWave | Watch Party</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        :root {
            --wp-bg: #05060a;
            --wp-panel: rgba(22, 24, 33, 0.7);
            --wp-accent: #ff4d00;
            --wp-border: rgba(255, 255, 255, 0.08);
        }

        body.watch-party-body {
            background-color: var(--wp-bg);
            margin: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        .wp-wrapper {
            display: grid;
            grid-template-columns: 1fr 380px;
            height: 100vh;
        }

        /* --- LEFT SIDE: PLAYER --- */
        .player-section {
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            position: relative;
        }

        .wp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--wp-panel);
            padding: 12px 25px;
            border-radius: 18px;
            backdrop-filter: blur(15px);
            border: 1px solid var(--wp-border);
        }

        .wp-header .logo a {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--wp-accent);
            text-decoration: none;
        }

        .header-info { display: flex; align-items: center; gap: 20px; }
        #wp-movie-title { font-size: 0.95rem; color: #ccc; font-weight: 500; }

        .header-actions { display: flex; gap: 10px; }
        .wp-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--wp-border);
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            text-decoration: none;
        }
        .wp-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
        .exit-btn { background: rgba(255, 75, 43, 0.1); color: #ff4b2b; border-color: rgba(255, 75, 43, 0.2); }
        .exit-btn:hover { background: #ff4b2b; color: white; }

        .player-main {
            flex: 1;
            background: #000;
            border-radius: 25px;
            overflow: hidden;
            border: 1px solid var(--wp-border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .player-main iframe { width: 100%; height: 100%; border: none; }

        .users-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 5px 0;
        }
        .user-pill {
            background: rgba(255,77,0,0.1);
            color: var(--wp-accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            white-space: nowrap;
            border: 1px solid rgba(255,77,0,0.2);
        }

        /* --- RIGHT SIDE: CHAT --- */
        .sidebar-section {
            background: var(--wp-panel);
            backdrop-filter: blur(20px);
            border-left: 1px solid var(--wp-border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            border: 1px solid var(--wp-border);
            overflow: hidden;
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--wp-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h3 { margin: 0; font-size: 1rem; color: #eee; }
        #user-count { font-size: 0.8rem; color: #888; }

        #chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-msg {
            background: rgba(255,255,255,0.03);
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 85%;
        }
        .chat-msg .user { font-weight: 700; color: var(--wp-accent); font-size: 0.75rem; margin-bottom: 3px; display: block; }
        .chat-msg .text { font-size: 0.85rem; color: #ddd; word-wrap: break-word; }

        .chat-input-area {
            padding: 15px;
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.2);
        }
        .chat-input-area input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--wp-border);
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
            outline: none;
            font-size: 0.9rem;
        }
        .chat-input-area input:focus { border-color: var(--wp-accent); }
        .send-btn {
            background: var(--wp-accent);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .send-btn:hover { transform: scale(1.05); }

        @media (max-width: 1024px) {
            .wp-wrapper { grid-template-columns: 1fr; overflow-y: auto; height: auto; }
            .sidebar-section { height: 500px; border-left: none; border-top: 1px solid var(--wp-border); }
        }
    </style>
</head>
<body class="watch-party-body">
    <div class="wp-wrapper">
        <!-- SOL TƏRƏF: PLEYER -->
        <main class="player-section">
            <header class="wp-header">
                <div class="header-info">
                    <div class="logo"><a href="/index.html">CineWave</a></div>
                    <div id="wp-movie-title">Yüklənir...</div>
                </div>
                <div class="header-actions">
                    <button class="wp-btn" onclick="copyRoomLink()">
                        <i class="fas fa-link"></i> <span>Linki Kopyala</span>
                    </button>
                    <a href="/index.html" class="wp-btn exit-btn">
                        <i class="fas fa-sign-out-alt"></i> <span>Otaqdan Çıx</span>
                    </a>
                </div>
            </header>

            <div class="player-main">
                <iframe id="wp-iframe" allowfullscreen></iframe>
            </div>

            <div class="users-bar" id="users-list">
                <!-- İstifadəçilər bura gələcək -->
            </div>
        </main>

        <!-- SAĞ TƏRƏF: ÇAT -->
        <aside class="sidebar-section">
            <div class="chat-container">
                <div class="chat-header">
                    <h3><i class="fas fa-comments"></i> Canlı Çat</h3>
                    <span id="user-count">0 nəfər</span>
                </div>
                <div id="chat-messages"></div>
                <form class="chat-input-area" id="chat-form">
                    <input type="text" id="wp-chat-input" placeholder="Mesaj yazın..." autocomplete="off">
                    <button type="submit" class="send-btn" id="wp-send-btn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </aside>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const user = JSON.parse(localStorage.getItem('cinewave_user') || 'null');
        
        if (!roomId || !user) {
            location.href = '/login.html';
        }

        const socket = io();
        const iframe = document.getElementById('wp-iframe');
        const chatBox = document.getElementById('chat-messages');
        const chatInput = document.getElementById('wp-chat-input');
        const sendBtn = document.getElementById('wp-send-btn');
        const usersList = document.getElementById('users-list');
        const userCount = document.getElementById('user-count');
        const movieTitleEl = document.getElementById('wp-movie-title');

        let movieData = JSON.parse(sessionStorage.getItem('pending_watch_party') || 'null');
        
        // Qonaq (guest) üçün məlumatları URL-dən oxu
        if (!movieData) {
            const mId = urlParams.get('id');
            const mType = urlParams.get('type');
            const mTitle = urlParams.get('title');
            if (mId && mType) {
                movieData = { id: mId, type: mType, title: decodeURIComponent(mTitle || 'Kino') };
            }
        }

        // Pleyeri dərhal yüklə (Socket-i gözləmə)
        if (movieData) {
            movieTitleEl.innerText = movieData.title;
            const embedUrl = movieData.type === 'movie' 
                ? `https://vidsrc.me/embed/movie/${movieData.id}`
                : `https://vidsrc.me/embed/tv/${movieData.id}/1/1`;
            iframe.src = embedUrl;
        }

        // Join Room
        socket.emit('join-room', { 
            roomId, 
            username: user.fullName,
            movieData: movieData,
            isPublic: movieData ? movieData.isPublic : false
        });

        socket.on('user-joined', (data) => {
            updateUsers(data.users);
            
            if (data.movie && !iframe.src) {
                movieData = data.movie;
                movieTitleEl.innerText = movieData.title;
                
                // Calculate elapsed time (in seconds)
                const elapsed = Math.floor((Date.now() - data.startTime) / 1000);
                
                const embedUrl = movieData.type === 'movie' 
                    ? `https://vidsrc.me/embed/movie/${movieData.id}?start=${elapsed}`
                    : `https://vidsrc.me/embed/tv/${movieData.id}/1/1?start=${elapsed}`;
                iframe.src = embedUrl;
            }
            
            // Load existing chat
            chatBox.innerHTML = '';
            data.chat.forEach(msg => addMessage(msg));
        });

        socket.on('room-error', (msg) => {
            document.body.innerHTML = `
                <div style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0a0b10; color:white; font-family:sans-serif; text-align:center; padding:20px;">
                    <i class="fas fa-door-closed" style="font-size:4rem; color:#ff4d00; margin-bottom:20px;"></i>
                    <h1 style="margin-bottom:10px;">Otaq Bağlanıb</h1>
                    <p style="color:#aaa; margin-bottom:30px;">${msg}</p>
                    <a href="/index.html" style="background:#ff4d00; color:white; text-decoration:none; padding:12px 25px; border-radius:10px; font-weight:600;">Ana Səhifəyə Qayıt</a>
                </div>
            `;
        });

        socket.on('user-left', (users) => {
            updateUsers(users);
        });

        socket.on('new-message', (msg) => {
            addMessage(msg);
        });

        function updateUsers(users) {
            userCount.innerText = `${users.length} nəfər`;
            usersList.innerHTML = users.map(u => `<span class="user-pill"><i class="fas fa-user"></i> ${u.username}</span>`).join('');
        }

        function addMessage(msg) {
            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.innerHTML = `<span class="user">${msg.username}</span><span class="text">${msg.message}</span>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            socket.emit('send-message', { roomId, username: user.fullName, message: text });
            chatInput.value = '';
        }

        sendBtn.onclick = sendMessage;
        chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };

        function copyRoomLink() {
            navigator.clipboard.writeText(window.location.href);
            alert('Otaq linki kopyalandı! Dostlarına göndər.');
        }

        // SYNC LOGIC (Simple Version for Embeds)
        // Since we are using an iframe, we cannot easily control the video state due to cross-origin policies.
        // However, we can notify users when the host refreshes or changes something.
    </script>
</body>
</html>
